<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KopaBridge — Dashboard</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <a class="brand" href="dashboard.html"><span class="bolt">⚡</span>KopaBridge</a>
      <div class="topbar-right">
        <span class="user-email" id="user-email"></span>
        <span class="role-badge" id="role-badge"></span>
        <a class="btn ghost" href="admin.html" id="admin-link" style="display:none">Admin</a>
        <button class="btn ghost" onclick="logout()">Sign out</button>
      </div>
    </div>

    <div id="denied-msg" style="display:none" class="msg error">
      That page is admin-only — you've been brought back here.
    </div>

    <p class="section-title">Credit standing</p>
    <div class="meter-card" id="meter-card">
      <p class="meter-empty">Loading…</p>
    </div>

    <p class="section-title">Connect a provider</p>
    <div class="card">
      <div class="card-row">
        <div>
          <div style="font-weight:600; margin-bottom:2px;">M-KOPA</div>
          <div class="status-line" id="connect-status">Not connected yet</div>
        </div>
        <button class="btn sun" id="connect-btn" onclick="connectMkopa()">Connect M-KOPA</button>
      </div>
    </div>

    <p class="section-title">Your energy accounts</p>
    <div class="card">
      <div id="accounts-area"><p class="empty-state">Loading…</p></div>
    </div>
  </div>

  <script src="assets/app.js"></script>
  <script>
    const user = requireAuth();
    let latestProfile = null;

    if (user) {
      document.getElementById('user-email').textContent = user.email;
      const roleBadge = document.getElementById('role-badge');
      roleBadge.textContent = user.role;
      roleBadge.classList.toggle('admin', user.role === 'admin');
      if (user.role === 'admin') {
        document.getElementById('admin-link').style.display = 'inline-flex';
      }
      if (new URLSearchParams(window.location.search).get('denied')) {
        document.getElementById('denied-msg').style.display = 'block';
      }

      loadCreditProfile();
      loadAccounts();
    }

    async function loadCreditProfile() {
      try {
        const profile = await apiFetch(`/credit-profile/${user.userId}`);
        latestProfile = profile;
        renderMeterFromProfile(profile);
      } catch (err) {
        document.getElementById('meter-card').innerHTML =
          `<p class="meter-empty">Couldn't load credit profile: ${escapeHtml(err.message)}</p>`;
      }
    }

    function renderMeterFromProfile(profile) {
      const el = document.getElementById('meter-card');
      if (!profile.creditScore) {
        el.innerHTML = renderMeterCard({ score: null });
        return;
      }
      const firstAccount = profile.energyAccounts[0];
      el.innerHTML = renderMeterCard({
        score: profile.creditScore.score,
        rating: profile.creditScore.rating,
        totalPayments: profile.paymentSummary.totalPayments,
        paid: profile.paymentSummary.paid,
        late: profile.paymentSummary.late,
        missed: profile.paymentSummary.missed,
        accountLabel: firstAccount ? firstAccount.accountNumber : '',
      });
    }

    async function loadAccounts() {
      const area = document.getElementById('accounts-area');
      try {
        const accounts = await apiFetch('/energy-accounts');
        if (!accounts.length) {
          area.innerHTML = '<p class="empty-state">No energy accounts connected yet — connect a provider above.</p>';
          return;
        }
        area.innerHTML = `
          <table>
            <thead>
              <tr><th>Account</th><th>Provider</th><th>Status</th><th></th></tr>
            </thead>
            <tbody>
              ${accounts
                .map(
                  (a) => `
                <tr>
                  <td class="mono">${escapeHtml(a.accountNumber)}</td>
                  <td>${escapeHtml(a.provider ? a.provider.name : '—')}</td>
                  <td><span class="pill ${a.isActive ? 'active' : 'inactive'}">${a.isActive ? 'active' : 'inactive'}</span></td>
                  <td><button class="small-link" onclick="viewScore('${a.id}')">View score</button></td>
                </tr>`,
                )
                .join('')}
            </tbody>
          </table>
        `;
        return accounts;
      } catch (err) {
        area.innerHTML = `<p class="empty-state">Couldn't load accounts: ${escapeHtml(err.message)}</p>`;
      }
    }

    async function viewScore(accountId) {
      try {
        const score = await apiFetch(`/credit-score/${accountId}`);
        let paid = 0, late = 0, missed = 0, accountLabel = '';

        if (latestProfile) {
          const match = latestProfile.energyAccounts.find((a) => a.id === accountId);
          if (match) {
            accountLabel = match.accountNumber;
            paid = match.payments.filter((p) => p.status === 'paid').length;
            late = match.payments.filter((p) => p.status === 'late').length;
            missed = match.payments.filter((p) => p.status === 'missed').length;
          }
        }

        document.getElementById('meter-card').innerHTML = renderMeterCard({
          score: score.score,
          rating: score.rating,
          totalPayments: score.totalPayments,
          paid,
          late,
          missed,
          accountLabel,
        });
        document.getElementById('meter-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
      } catch (err) {
        alert(`Couldn't load score: ${err.message}`);
      }
    }

    async function connectMkopa() {
      const btn = document.getElementById('connect-btn');
      const status = document.getElementById('connect-status');
      btn.disabled = true;

      try {
        status.textContent = 'Requesting authorization…';
        const { authUrl } = await apiFetch(`/providers/m-kopa/connect/${user.userId}`);

        // authUrl points at M-KOPA's (mocked) consent screen. There's no
        // real provider to redirect to yet, so this demo simulates the
        // round trip: a brief pause standing in for the user approving
        // access on M-KOPA's side, then the same callback a real OAuth
        // redirect would hit.
        void authUrl;
        status.textContent = 'Redirecting to M-KOPA for consent (simulated)…';
        await sleep(900);

        const url = new URL(authUrl);
        const state = url.searchParams.get('state');
        const demoCode = `demo-${Date.now()}`;

        status.textContent = 'Consent granted — connecting…';
        await apiFetch(`/providers/m-kopa/callback/${demoCode}?state=${encodeURIComponent(state)}`, {
          method: 'GET',
        });

        status.textContent = 'Connected — syncing your account…';
        await pollForNewAccount();
      } catch (err) {
        status.textContent = `Couldn't connect: ${err.message}`;
      } finally {
        btn.disabled = false;
      }
    }

    async function pollForNewAccount() {
      const before = (await loadAccounts()) || [];
      for (let attempt = 0; attempt < 6; attempt++) {
        await sleep(1300);
        const after = await loadAccounts();
        if (after && after.length > before.length) {
          document.getElementById('connect-status').textContent = 'Connected and synced.';
          await loadCreditProfile();
          return;
        }
      }
      document.getElementById('connect-status').textContent =
        'Connected — sync is still running in the background, refresh shortly.';
    }

    function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }
  </script>
</body>
</html>
