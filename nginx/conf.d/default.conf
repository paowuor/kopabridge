upstream kopabridge_api {
    server api:3000;
}

# ==============================================================================
# HTTP SERVER - PORT 80 ENTRYPOINT
# ==============================================================================
server {
    listen 80;
    server_name localhost; # 💡 Replace with your domain name (e.g., app.kopabridge.com) later

    client_max_body_size 10M;

    # 💡 ACME challenge path placeholder for automated Let's Encrypt renewal checks
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Dedicated telemetry path, kept unversioned for load balancers/orchestrators.
    location /health {
        proxy_pass http://kopabridge_api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Versioned API — the customer portal (served below) calls this at the
    # same origin, so no CORS round trip is even needed in this setup.
    location /api/ {
        proxy_pass http://kopabridge_api/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }

    # Swagger/OpenAPI docs, for developers integrating against the API directly.
    location /docs {
        proxy_pass http://kopabridge_api/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /docs-json {
        proxy_pass http://kopabridge_api/docs-json;
        proxy_set_header Host $host;
    }

    # Customer portal — plain static HTML/JS/CSS, served directly by nginx.
    # See apps/web/.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }
}

